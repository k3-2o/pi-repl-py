name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: extras/setup-just@v2
      - name: System Python (for the guest venv)
        run: sudo apt-get update && sudo apt-get install -y python3 python3-venv python3-pip
      - name: Install deps + build the Python venv
        run: just setup
      - name: Typecheck, lint, and test
        run: just check